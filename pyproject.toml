[project]
name = "taskflow-fastapi"
version = "0.1.0"
description = "A small, typed personal task manager"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "uvicorn>=0.34,<1", "tzdata>=2025.1"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.8,<3"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.13"
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.coverage.run]
source = ["app"]
[tool.coverage.report]
fail_under = 90
