<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow — 今日を、ひとつずつ。</title><link rel="stylesheet" href="/static/css/style.css"><script src="/static/js/app.js" defer></script></head>
<body><header><a class="brand" href="/">✓ <span>TaskFlow</span></a><span class="local">PERSONAL WORKSPACE</span></header><main><div class="intro"><div><p class="eyebrow">LESS NOISE, MORE FOCUS</p><h1>今日を、ひとつずつ。</h1><p class="muted">やることを整理して、大切なことに集中しましょう。</p></div><button id="new-task">＋ タスクを追加</button></div><section class="stats" aria-label="タスク集計"><article><span>すべてのタスク</span><strong id="total">—</strong></article><article><span>未完了</span><strong id="pending">—</strong></article><article><span>完了済み</span><strong id="completed">—</strong></article><article><span>期限切れ</span><strong id="overdue">—</strong></article></section><section class="workspace"><div class="toolbar"><div class="tabs" aria-label="絞り込み"><button data-status="all" aria-pressed="true">すべて</button><button data-status="pending" aria-pressed="false">未完了</button><button data-status="completed" aria-pressed="false">完了済み</button></div><label>並び替え <select id="sort"><option value="created_at">作成日時順</option><option value="priority">優先順位順</option><option value="due_date">期限順</option></select></label></div><p id="message" role="status" aria-live="polite"></p><div id="tasks" class="tasks" aria-busy="true"></div><div id="empty" hidden><span class="empty-icon">✓</span><h2>すっきりしたリストで、はじめよう。</h2><p>タスクを追加して、次の一歩を明確に。</p></div></section><footer>自分のペースで、一歩ずつ。<span>期限の基準: Asia/Tokyo · <a href="/docs">APIドキュメント ↗</a></span></footer></main>
<dialog id="editor"><form id="task-form"><div class="dialog-heading"><h2 id="editor-title">タスクを追加</h2><button type="button" id="close-editor" class="icon" aria-label="閉じる">×</button></div><label>タイトル <span class="required">必須</span><input name="title" required maxlength="100" placeholder="何をしますか？"></label><label>詳細<textarea name="description" maxlength="1000" rows="4" placeholder="メモや補足を追加"></textarea></label><div class="form-row"><label>優先順位<select name="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></label><label>期限<input name="due_date" type="date"></label></div><label class="check-label"><input name="is_completed" type="checkbox">完了済みにする</label><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel" class="secondary">キャンセル</button><button type="submit" id="save">保存する</button></div></form></dialog>
<dialog id="delete-dialog"><h2>タスクを削除しますか？</h2><p>この操作は取り消せません。</p><p id="delete-error" role="alert"></p><div class="actions"><button id="keep" class="secondary">キャンセル</button><button id="confirm-delete" class="danger">削除する</button></div></dialog></body></html>
