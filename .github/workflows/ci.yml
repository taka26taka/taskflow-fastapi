name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: curl --fail http://localhost:8000/health
      - run: curl --fail http://localhost:8000/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
